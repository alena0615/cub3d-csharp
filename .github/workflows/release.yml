
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Сборка cub3d.exe
        run: >
          dotnet publish src/Cub3D -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o out

      - name: Архив с картами и текстурами
        run: |
          cp -r maps textures out/
          printf '@echo off\r\ncd /d "%%~dp0"\r\ncub3d.exe maps\\bonus.cub\r\nif errorlevel 1 pause\r\n' > out/play.bat
          cd out && zip -r ../cub3d-win-x64.zip .

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cub3d-win-x64.zip out/cub3d.exe --repo "$GITHUB_REPOSITORY" --generate-notes
